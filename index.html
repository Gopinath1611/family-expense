<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .expense-card { transition: transform 0.2s, box-shadow 0.2s; }
        .expense-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-6 shadow-lg mb-8">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fas fa-users-cog"></i> Family Expense
                </h1>
                <p class="text-blue-100 text-sm">Shared Family Spending Tracker</p>
            </div>
            <button onclick="exportToPDF()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 hover:bg-blue-50 transition">
                <i class="fas fa-file-pdf"></i> Download PDF
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pb-20">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Sidebar: Add Expense -->
            <div class="md:col-span-1">
                <div class="glass p-6 rounded-2xl shadow-sm sticky top-8">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2">Add New Entry</h2>
                    <form id="expenseForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Amount (₹)</label>
                            <input type="number" id="amount" required placeholder="0.00" class="w-full p-3 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Category</label>
                            <select id="category" class="w-full p-3 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                                <option>Food & Dining</option>
                                <option>Groceries</option>
                                <option>Rent/Bills</option>
                                <option>Travel</option>
                                <option>Shopping</option>
                                <option>Medical</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Location</label>
                            <input type="text" id="location" placeholder="e.g. Saravana Stores" class="w-full p-3 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Reason/Note</label>
                            <textarea id="reason" rows="2" placeholder="Why this expense?" class="w-full p-3 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Date</label>
                            <input type="date" id="date" required class="w-full p-3 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-md">
                            Save Expense
                        </button>
                    </form>
                </div>
            </div>

            <!-- Main Content: List -->
            <div class="md:col-span-2">
                <!-- Dashboard Summary -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-xs text-slate-500 font-bold uppercase">Total Spend</p>
                        <h3 class="text-2xl font-bold" id="totalAmount">₹0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-xs text-slate-500 font-bold uppercase">Entries</p>
                        <h3 class="text-2xl font-bold" id="totalCount">0</h3>
                    </div>
                </div>

                <div class="flex flex-col gap-4" id="expenseList">
                    <!-- Expenses will appear here -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="text-center py-20 bg-white rounded-3xl border-2 border-dashed hidden">
                    <i class="fas fa-receipt text-slate-300 text-5xl mb-4"></i>
                    <p class="text-slate-500">No expenses found. Start adding some!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // UPDATED WITH YOUR REAL CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyApM9gqxuGbL_IX-N0T7VheVt91I8c_4Vk",
            authDomain: "family-expense-98c48.firebaseapp.com",
            projectId: "family-expense-98c48",
            storageBucket: "family-expense-98c48.firebasestorage.app",
            messagingSenderId: "888226022690",
            appId: "1:888226022690:web:4dd8f04262f6574a69917b",
            measurementId: "G-BNBRSQMKWM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Using a direct collection for your project to ensure simplicity
        const expenseCol = collection(db, 'family_expenses');

        const form = document.getElementById('expenseForm');
        const list = document.getElementById('expenseList');
        const emptyState = document.getElementById('emptyState');
        const totalDisplay = document.getElementById('totalAmount');
        const countDisplay = document.getElementById('totalCount');

        document.getElementById('date').valueAsDate = new Date();

        // Save Data
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Saving...";

            try {
                await addDoc(expenseCol, {
                    amount: parseFloat(document.getElementById('amount').value),
                    category: document.getElementById('category').value,
                    location: document.getElementById('location').value,
                    reason: document.getElementById('reason').value,
                    date: document.getElementById('date').value,
                    createdAt: new Date().toISOString()
                });
                form.reset();
                document.getElementById('date').valueAsDate = new Date();
            } catch (err) {
                console.error("Error saving:", err);
                alert("Failed to save. Check if Firestore Rules are set to 'Test Mode'.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Expense";
            }
        });

        // Real-time Listen
        onSnapshot(expenseCol, (snapshot) => {
            const data = [];
            snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
            data.sort((a, b) => new Date(b.date) - new Date(a.date));
            renderExpenses(data);
        }, (error) => {
            console.error("Firestore Listen Error:", error);
        });

        function renderExpenses(expenses) {
            list.innerHTML = '';
            let total = 0;

            if (expenses.length === 0) {
                emptyState.classList.remove('hidden');
                totalDisplay.innerText = "₹0";
                countDisplay.innerText = "0";
                return;
            }

            emptyState.classList.add('hidden');
            
            expenses.forEach(exp => {
                total += exp.amount;
                const card = document.createElement('div');
                card.className = "expense-card bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex gap-4 items-center">
                        <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                            <i class="fas ${getIcon(exp.category)}"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-lg">₹${exp.amount.toLocaleString('en-IN')}</h4>
                            <p class="text-sm text-slate-500 font-medium">${exp.location || 'Unknown Location'}</p>
                            <div class="flex gap-2 items-center mt-1">
                                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-bold uppercase">${exp.category}</span>
                                <span class="text-[10px] text-slate-400"><i class="far fa-calendar"></i> ${exp.date}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="deleteEntry('${exp.id}')" class="text-slate-300 hover:text-red-500 p-2 transition">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });

            totalDisplay.innerText = `₹${total.toLocaleString('en-IN')}`;
            countDisplay.innerText = expenses.length;
            window.currentData = expenses;
        }

        window.deleteEntry = async (id) => {
            if (confirm("Delete this entry?")) {
                await deleteDoc(doc(db, 'family_expenses', id));
            }
        };

        function getIcon(cat) {
            const icons = {
                'Food & Dining': 'fa-utensils',
                'Groceries': 'fa-shopping-basket',
                'Rent/Bills': 'fa-file-invoice-dollar',
                'Travel': 'fa-car',
                'Shopping': 'fa-shopping-bag',
                'Medical': 'fa-hospital',
                'Other': 'fa-tag'
            };
            return icons[cat] || 'fa-receipt';
        }

        window.exportToPDF = () => {
            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF();
            
            docPdf.setFontSize(22);
            docPdf.setTextColor(37, 99, 235);
            docPdf.text("Family Expense Report", 14, 20);
            
            docPdf.setFontSize(10);
            docPdf.setTextColor(100);
            docPdf.text(`Generated on: ${new Date().toLocaleDateString()}`, 14, 28);
            
            const tableData = (window.currentData || []).map(e => [
                e.date,
                e.category,
                e.location,
                e.reason,
                `Rs. ${e.amount}`
            ]);

            docPdf.autoTable({
                startY: 35,
                head: [['Date', 'Category', 'Location', 'Reason', 'Amount']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [37, 99, 235] }
            });

            docPdf.save(`Family_Expenses_${new Date().toISOString().split('T')[0]}.pdf`);
        };
    </script>
</body>
</html>
